  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"5b7a75bb-8863-465d-935a-3e00aaec5a18\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"abb61172-acde-496f-b5bd-05f6bf4bd3a0\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"8c044be7-3d6d-4794-9ada-6f3dfb523e70\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"981db54d-f26b-4eb1-ad10-ebd849aa9212\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\ndoc-page:not(:defined){visibility:hidden}\na{color:#A6823E}a:hover{color:#B03E27}\n<\u002Fstyle>\n<script src=\"52f2ac46-53cb-4bdd-bdd3-ea20e641deda\"><\u002Fscript>\n<\u002Fhelmet>\n\n\n<doc-page margin=\"0.7in\">\n<div style=\"font-family:'Golos Text',system-ui,sans-serif;color:#211F1C\">\n\n  <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:2px solid #211F1C\">\n    <div style=\"display:grid;gap:8px\">\n      <div style=\"font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:#9C958B\">Skyline Engineering · контент-бренд · v1.0 · 2026<\u002Fdiv>\n      <div style=\"font:600 34px/1.05 'Golos Text',sans-serif;letter-spacing:-.03em\">Гайд по оформлению<br>направление «Тёплый серо-беж»<\u002Fdiv>\n      <div style=\"font:400 13px/1.55 'Golos Text',sans-serif;color:#5C564E;max-width:430px\">Один документ для передачи агенту: палитра, типографика, логотип, графические приёмы, шаблоны носителей и правила публикаций.<\u002Fdiv>\n    <\u002Fdiv>\n    <img src=\"f6f7d654-1e4e-4864-ac76-c4d4d97d5bf8\" alt=\"Skyline Engineering\" style=\"width:88px;height:auto;display:block\">\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:22px\">\n    <div style=\"display:grid;gap:8px\">\n      <div style=\"font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#9C958B\">О бренде<\u002Fdiv>\n      <div style=\"font:400 12.5px/1.6 'Golos Text',sans-serif;color:#3B3831\">Строительство премиальных вилл под ключ на Коста-Бланке (Хавеа, Морайра, Бенисса, Кальпе). Аудитория — русскоязычные покупатели, 35–60 лет, покупают дом для жизни и как инвестицию.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:8px\">\n      <div style=\"font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#9C958B\">Тональность оформления<\u002Fdiv>\n      <div style=\"font:400 12.5px/1.6 'Golos Text',sans-serif;color:#3B3831\">Мягкая, тёплая, дорогая. Светлый серо-бежевый камень как основа, приглушённое золото — металл деталей, красно-оранжевый из логотипа — редкая подпись. Никакого «техно», градиентов, синего и холодного серого.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"margin:30px 0 14px;font:600 20px/1.2 'Golos Text',sans-serif;letter-spacing:-.02em;padding-bottom:8px;border-bottom:1px solid rgba(33,31,28,.16)\">1. Палитра<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;break-inside:avoid\">\n    <div style=\"display:grid;gap:7px\"><div style=\"height:64px;background:#EAE6DF;border:1px solid rgba(33,31,28,.14)\"><\u002Fdiv><div style=\"font:500 12px 'Golos Text',sans-serif\">Фон · Sand Grey<\u002Fdiv><div style=\"font:400 10.5px/1.5 'IBM Plex Mono',monospace;color:#6E675D\">#EAE6DF<br>R234 G230 B223<\u002Fdiv><div style=\"font:400 11px/1.45 'Golos Text',sans-serif;color:#5C564E\">Основной фон всех носителей. ~55% площади.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;gap:7px\"><div style=\"height:64px;background:#F6F4F0;border:1px solid rgba(33,31,28,.14)\"><\u002Fdiv><div style=\"font:500 12px 'Golos Text',sans-serif\">Поверхность · Paper<\u002Fdiv><div style=\"font:400 10.5px/1.5 'IBM Plex Mono',monospace;color:#6E675D\">#F6F4F0<br>R246 G244 B240<\u002Fdiv><div style=\"font:400 11px/1.45 'Golos Text',sans-serif;color:#5C564E\">Карточки, посты, слайды поверх фона. ~20%.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;gap:7px\"><div style=\"height:64px;background:#BFB8AC\"><\u002Fdiv><div style=\"font:500 12px 'Golos Text',sans-serif\">Камень · Stone<\u002Fdiv><div style=\"font:400 10.5px/1.5 'IBM Plex Mono',monospace;color:#6E675D\">#BFB8AC<br>R191 G184 B172<\u002Fdiv><div style=\"font:400 11px/1.45 'Golos Text',sans-serif;color:#5C564E\">Плашки, разделители, текстуры. ~10%.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;gap:7px\"><div style=\"height:64px;background:#6E675D\"><\u002Fdiv><div style=\"font:500 12px 'Golos Text',sans-serif\">Графит · Graphite<\u002Fdiv><div style=\"font:400 10.5px/1.5 'IBM Plex Mono',monospace;color:#6E675D\">#6E675D<br>R110 G103 B93<\u002Fdiv><div style=\"font:400 11px/1.45 'Golos Text',sans-serif;color:#5C564E\">Второй тёмный, подписи на светлом. ~7%.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;gap:7px\"><div style=\"height:64px;background:#A6823E\"><\u002Fdiv><div style=\"font:500 12px 'Golos Text',sans-serif\">Золото · Bronze<\u002Fdiv><div style=\"font:400 10.5px/1.5 'IBM Plex Mono',monospace;color:#6E675D\">#A6823E<br>R166 G130 B62<\u002Fdiv><div style=\"font:400 11px/1.45 'Golos Text',sans-serif;color:#5C564E\">Линии-ленты, цифры, рамки. ~5%, только акцент.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;gap:7px\"><div style=\"height:64px;background:#B03E27\"><\u002Fdiv><div style=\"font:500 12px 'Golos Text',sans-serif\">Красный · Signal<\u002Fdiv><div style=\"font:400 10.5px/1.5 'IBM Plex Mono',monospace;color:#6E675D\">#B03E27<br>R176 G62 B39<\u002Fdiv><div style=\"font:400 11px/1.45 'Golos Text',sans-serif;color:#5C564E\">Максимум 3% площади: стрелки, «engineering», один акцент на макет.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n    <div style=\"padding:14px 16px;background:#F6F4F0;border-left:3px solid #A6823E;break-inside:avoid\">\n      <div style=\"font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#6E675D;margin-bottom:6px\">Тёмный текст<\u002Fdiv>\n      <div style=\"font:400 12px/1.55 'Golos Text',sans-serif;color:#3B3831\">Заголовки — #211F1C, основной текст — #5C564E, подписи — #9C958B. Чистый чёрный #000 не используется.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px 16px;background:#F6F4F0;border-left:3px solid #B03E27;break-inside:avoid\">\n      <div style=\"font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#6E675D;margin-bottom:6px\">Запрещено<\u002Fdiv>\n      <div style=\"font:400 12px/1.55 'Golos Text',sans-serif;color:#3B3831\">Холодный серый и синий, неон, чёрный фон, цветные градиенты, более двух акцентов в одном макете.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"margin:30px 0 14px;font:600 20px/1.2 'Golos Text',sans-serif;letter-spacing:-.02em;padding-bottom:8px;border-bottom:1px solid rgba(33,31,28,.16)\">2. Типографика<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:26px;break-inside:avoid\">\n    <div style=\"display:grid;gap:12px\">\n      <div style=\"font:400 34px/1.06 'Golos Text',sans-serif;letter-spacing:-.025em\">Инженерия спокойного дома<\u002Fdiv>\n      <div style=\"font:400 10.5px 'IBM Plex Mono',monospace;color:#9C958B\">Golos Text Regular 400 · трекинг −2.5% · интерлиньяж 1.06 · H1<\u002Fdiv>\n      <div style=\"font:500 20px/1.2 'Golos Text',sans-serif;letter-spacing:-.015em\">Подзаголовок раздела<\u002Fdiv>\n      <div style=\"font:400 10.5px 'IBM Plex Mono',monospace;color:#9C958B\">Golos Text Medium 500 · трекинг −1.5% · H2<\u002Fdiv>\n      <div style=\"font:400 13px/1.65 'Golos Text',sans-serif;color:#5C564E\">Основной текст. Golos Text Regular, интерлиньяж 1.6–1.7, длина строки 55–70 знаков. Переносы выключены, выравнивание по левому краю.<\u002Fdiv>\n      <div style=\"font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#A6823E\">Этап 04 · фасадные работы<\u002Fdiv>\n      <div style=\"font:400 10.5px 'IBM Plex Mono',monospace;color:#9C958B\">IBM Plex Mono 500 · трекинг +20% · капслок · только подписи, цифры, даты<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:9px;align-content:start\">\n      <div style=\"font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#9C958B\">Шкала кегля<\u002Fdiv>\n      <div style=\"font:400 12px/1.7 'Golos Text',sans-serif;color:#3B3831\">\n        Пост Instagram 1080×1350: H1 84–104 px · текст 40–46 px · подпись 30 px<br>\n        Сторис 1080×1920: H1 96–120 px · текст 44 px<br>\n        Слайд 1920×1080: H1 96–104 px · текст 32–36 px · подпись 24 px<br>\n        Сайт: H1 56 px · текст 17 px · подпись 13 px\n      <\u002Fdiv>\n      <div style=\"padding:12px 14px;background:#F6F4F0;font:400 11.5px/1.55 'Golos Text',sans-serif;color:#3B3831\">Никогда: капслок в заголовках, курсив, обводка, тени у текста, два начертания в одной строке кроме цветового акцента.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"margin:30px 0 14px;font:600 20px/1.2 'Golos Text',sans-serif;letter-spacing:-.02em;padding-bottom:8px;border-bottom:1px solid rgba(33,31,28,.16)\">3. Логотип<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:.8fr 1.2fr;gap:26px;break-inside:avoid\">\n    <div style=\"padding:22px;background:#F6F4F0;display:flex;align-items:center;justify-content:center\"><img src=\"f6f7d654-1e4e-4864-ac76-c4d4d97d5bf8\" alt=\"Skyline Engineering\" style=\"width:150px;height:auto;display:block\"><\u002Fdiv>\n    <div style=\"font:400 12.5px/1.7 'Golos Text',sans-serif;color:#3B3831\">\n      Файл: <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px\">assets/skyline-logo.png<\u002Fspan> (PNG с прозрачностью; запросить SVG у заказчика).<br>\n      Охранное поле — не менее высоты треугольника ×0.35 со всех сторон.<br>\n      Минимальный размер: 28 px по высоте в цифре, 12 мм в печати.<br>\n      Фоны: #EAE6DF, #F6F4F0, фото со светлым спокойным участком. На тёмном фото — только версия со светлым словесным знаком (запросить).<br>\n      Нельзя: перекрашивать, добавлять тени и обводки, растягивать, разворачивать ленту, ставить на пёстрый участок фото, повторять как паттерн.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"margin:30px 0 14px;font:600 20px/1.2 'Golos Text',sans-serif;letter-spacing:-.02em;padding-bottom:8px;border-bottom:1px solid rgba(33,31,28,.16)\">4. Графические приёмы и текстуры<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;break-inside:avoid\">\n    <div style=\"display:grid;gap:7px\"><div style=\"height:88px;background:radial-gradient(circle at 40% 40%,rgba(33,31,28,.05) 0 1px,transparent 1.5px) 0 0/8px 8px,#DFDAD1\"><\u002Fdiv><div style=\"font:500 11.5px 'Golos Text',sans-serif\">Микроцемент<\u002Fdiv><div style=\"font:400 10.5px/1.45 'Golos Text',sans-serif;color:#5C564E\">Мелкое зерно на светлых плашках. Прозрачность 5%.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;gap:7px\"><div style=\"height:88px;background:repeating-linear-gradient(90deg,rgba(33,31,28,.07) 0 1px,transparent 1px 5px),#D6D0C6\"><\u002Fdiv><div style=\"font:500 11.5px 'Golos Text',sans-serif\">Полосы льна<\u002Fdiv><div style=\"font:400 10.5px/1.45 'Golos Text',sans-serif;color:#5C564E\">Вертикальные линии 1/5 px. Для фона цитат и цифр.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;gap:7px\"><div style=\"height:88px;background:repeating-linear-gradient(135deg,rgba(33,31,28,.1) 0 2px,transparent 2px 12px),#BFB8AC\"><\u002Fdiv><div style=\"font:500 11.5px 'Golos Text',sans-serif\">Камень<\u002Fdiv><div style=\"font:400 10.5px/1.45 'Golos Text',sans-serif;color:#5C564E\">Диагональная штриховка 135°. Обложки рубрик.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:grid;gap:7px\"><div style=\"height:88px;background:#F6F4F0;position:relative;overflow:hidden\"><div style=\"position:absolute;left:0;right:0;top:50%;height:1px;background:#A6823E\"><\u002Fdiv><div style=\"position:absolute;left:22%;top:calc(50% - 4px);width:8px;height:8px;background:#B03E27;transform:rotate(45deg)\"><\u002Fdiv><\u002Fdiv><div style=\"font:500 11.5px 'Golos Text',sans-serif\">Линия-лента<\u002Fdiv><div style=\"font:400 10.5px/1.45 'Golos Text',sans-serif;color:#5C564E\">Золотая линия 1–5 px, наклон −6…−9°, точка-ромб красным.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:16px;break-inside:avoid\">\n    <div style=\"display:grid;gap:8px\">\n      <div style=\"height:110px;background:#F6F4F0;position:relative;overflow:hidden\"><div style=\"position:absolute;inset:0;background:#BFB8AC;clip-path:polygon(0 100%,26% 34%,44% 62%,68% 12%,100% 100%)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"font:400 11.5px/1.55 'Golos Text',sans-serif;color:#3B3831\"><span style=\"font-weight:500\">Контур горы<\u002Fspan> — силуэт из логотипа как маска для фото или плашка внизу макета. Пики всегда разной высоты, основание по нижнему краю, наклон не менять.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:8px\">\n      <div style=\"height:110px;background:#211F1C;position:relative;overflow:hidden\"><div style=\"position:absolute;left:-8%;top:46%;width:116%;height:4px;transform:rotate(-8deg);background:linear-gradient(90deg,rgba(166,130,62,0),#A6823E,#EBD7A4,#A6823E,rgba(166,130,62,0))\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"font:400 11.5px/1.55 'Golos Text',sans-serif;color:#3B3831\"><span style=\"font-weight:500\">Золотая лента<\u002Fspan> — один диагональный жест на макет: разделитель, подчёркивание цифры, линия под заголовком. Никогда не пересекает лицо на фото и не используется дважды в одном кадре.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"margin:30px 0 14px;font:600 20px/1.2 'Golos Text',sans-serif;letter-spacing:-.02em;padding-bottom:8px;border-bottom:1px solid rgba(33,31,28,.16)\">5. Шаблоны носителей<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;break-inside:avoid\">\n    <div style=\"display:grid;gap:8px\">\n      <div style=\"height:200px;background:#F6F4F0;padding:14px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\"><img src=\"f6f7d654-1e4e-4864-ac76-c4d4d97d5bf8\" alt=\"\" style=\"width:18px;height:auto\"><span style=\"font:400 8px 'IBM Plex Mono',monospace;color:#9C958B\">01 / 06<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;gap:8px\"><div style=\"font:400 17px/1.12 'Golos Text',sans-serif;letter-spacing:-.02em\">Покупка виллы в Испании: 7 шагов<\u002Fdiv><div style=\"height:1px;background:#A6823E;width:60%\"><\u002Fdiv><div style=\"font:400 9px/1.4 'Golos Text',sans-serif;color:#5C564E\">NIE · due diligence · лицензия<\u002Fdiv><\u002Fdiv>\n        <div style=\"font:400 8.5px 'Golos Text',sans-serif;color:#B03E27\">Листайте →<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:400 11px/1.5 'Golos Text',sans-serif;color:#3B3831\"><span style=\"font-weight:500\">Пост-карусель 1080×1350.<\u002Fspan> Поля 64 px. Логотип сверху слева 34 px, счётчик карточек справа моно. Заголовок внизу.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:8px\">\n      <div style=\"height:200px;background:repeating-linear-gradient(38deg,#DDD7CD 0 8px,#E6E1D8 8px 16px);position:relative;display:flex;flex-direction:column;justify-content:flex-end\">\n        <span style=\"position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font:400 8.5px 'IBM Plex Mono',monospace;color:#7E776C;background:rgba(246,244,240,.85);padding:4px 7px\">фото 4:5<\u002Fspan>\n        <div style=\"padding:14px;background:linear-gradient(180deg,rgba(33,31,28,0),rgba(33,31,28,.8) 44%)\"><div style=\"font:400 8px 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#C9C1B4;margin-bottom:5px\">Архитектура<\u002Fdiv><div style=\"font:400 15px/1.15 'Golos Text',sans-serif;color:#F6F4F0\">Материалы, которые не устают<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:400 11px/1.5 'Golos Text',sans-serif;color:#3B3831\"><span style=\"font-weight:500\">Фото-пост 1080×1350.<\u002Fspan> Затемнение снизу 0→80% на 44% высоты. Рубрика моно капслоком, заголовок не более трёх строк.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:8px\">\n      <div style=\"height:200px;background:#F6F4F0;padding:14px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;box-sizing:border-box\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font:400 7.5px 'IBM Plex Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:#9C958B\">Villa Sereno<\u002Fspan><img src=\"f6f7d654-1e4e-4864-ac76-c4d4d97d5bf8\" alt=\"\" style=\"width:16px;height:auto\"><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\"><div style=\"background:repeating-linear-gradient(38deg,#DDD7CD 0 8px,#E6E1D8 8px 16px)\"><\u002Fdiv><div style=\"display:grid;gap:5px;align-content:end\"><div style=\"font:400 13px/1.1 'Golos Text',sans-serif;letter-spacing:-.02em\">Дом как продолжение рельефа<\u002Fdiv><div style=\"font:400 8.5px/1.4 'Golos Text',sans-serif;color:#5C564E\">Три объёма по уровням склона<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;padding-top:7px;border-top:1px solid rgba(33,31,28,.14)\"><span style=\"font:400 8px 'Golos Text',sans-serif;color:#5C564E\">Сдача — <span style=\"color:#A6823E\">Q4 2027<\u002Fspan><\u002Fspan><span style=\"font:400 8px 'IBM Plex Mono',monospace;color:#B03E27\">03<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:400 11px/1.5 'Golos Text',sans-serif;color:#3B3831\"><span style=\"font-weight:500\">Слайд презентации 1920×1080.<\u002Fspan> Поля 88 px. Шапка: название объекта слева, логотип справа. Футер: факты + номер слайда.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:14px;font:400 12px/1.65 'Golos Text',sans-serif;color:#3B3831\">Дополнительно по тем же правилам: сторис 1080×1920 (поля 80 px, кнопка-строка внизу), обложка YouTube 1280×720 (заголовок в две строки, логотип в правом нижнем углу), аватар — треугольник знака на #EAE6DF без словесной части.<\u002Fdiv>\n\n  <h2 style=\"margin:30px 0 14px;font:600 20px/1.2 'Golos Text',sans-serif;letter-spacing:-.02em;padding-bottom:8px;border-bottom:1px solid rgba(33,31,28,.16)\">6. Фотография<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px;break-inside:avoid\">\n    <div style=\"font:400 12.5px/1.7 'Golos Text',sans-serif;color:#3B3831\">Тёплый естественный свет: раннее утро или час до закáта. Спокойные кадры без людей крупным планом, архитектура целиком или фрагмент фасада. Обязательный минимум на объект: общий вид, фрагмент материала, интерьер, вид с террасы, кадр стройки.<\u002Fdiv>\n    <div style=\"font:400 12.5px/1.7 'Golos Text',sans-serif;color:#3B3831\">Обработка: тёплый баланс белого, контраст умеренный, тени не в чёрный, без HDR и синих теней. Нельзя: стоковые фото с чужими объектами, сильные фильтры, наклон горизонта, водяные знаки поверх кадра.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"margin:30px 0 14px;font:600 20px/1.2 'Golos Text',sans-serif;letter-spacing:-.02em;padding-bottom:8px;border-bottom:1px solid rgba(33,31,28,.16)\">7. Рубрики и тон текста<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px;break-inside:avoid\">\n    <div style=\"display:grid;gap:9px\">\n      <div style=\"font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#9C958B\">Шесть рубрик<\u002Fdiv>\n      <div style=\"font:400 12.5px/1.75 'Golos Text',sans-serif;color:#3B3831\">Ход стройки — прогресс объектов, недели, проценты готовности.<br>Гид по покупке — юридические шаги, налоги, документы.<br>Архитектура и интерьеры — решения, материалы, детали.<br>Инвестиции и цифры — доходность, цены, содержание.<br>Лайфстайл Коста-Бланки — районы, море, повседневность.<br>Личный бренд основателя — от первого лица, «за кадром».<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:9px\">\n      <div style=\"font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#9C958B\">Тон<\u002Fdiv>\n      <div style=\"font:400 12.5px/1.7 'Golos Text',sans-serif;color:#3B3831\">Спокойно, по делу, с уважением к читателю. Конкретика вместо прилагательных: «терраса 210 м², вид на юго-восток», а не «роскошная терраса мечты».<\u002Fdiv>\n      <div style=\"padding:12px 14px;background:#F6F4F0;font:400 11.5px/1.6 'Golos Text',sans-serif;color:#3B3831\">Не используем: «элитный», «уникальный», «инвестируй сейчас», капслок, восклицательные знаки, эмодзи, срочность и скидочную лексику.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"margin:30px 0 14px;font:600 20px/1.2 'Golos Text',sans-serif;letter-spacing:-.02em;padding-bottom:8px;border-bottom:1px solid rgba(33,31,28,.16)\">8. Чек-лист перед публикацией<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px;font:400 12.5px/1.8 'Golos Text',sans-serif;color:#3B3831;break-inside:avoid\">\n    <div>Фон из палитры, не чистый белый.<br>Один акцентный жест: лента или красная деталь, не оба.<br>Красного не более 3% площади.<br>Моно только в подписях и цифрах.<\u002Fdiv>\n    <div>Логотип с охранным полем, не меньше 28 px.<br>Заголовок читается на превью в ленте.<br>Числа с неразрывными пробелами: 1 240 м².<br>Указан объект и город.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:26px;padding-top:14px;border-top:1px solid rgba(33,31,28,.16);display:flex;justify-content:space-between;font:400 10.5px 'IBM Plex Mono',monospace;color:#9C958B\">\n    <span>Skyline Engineering · brand guide v1.0 · направление «Тёплый серо-беж»<\u002Fspan>\n    <span>Файлы: assets/skyline-logo.png · шрифты Golos Text, IBM Plex Mono (Google Fonts)<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdoc-page>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
