# /etc/nginx/sites-available/skyline-engineering.conf
#
# Reverse proxy Nginx -> Next.js (next start on port 3000) with a public
# Let's Encrypt certificate issued for skylineengineering.es and www.

# Before enabling Cloudflare real-IP restoration, install the current Cloudflare
# IP ranges in /etc/nginx/conf.d/cloudflare-real-ip.conf. Never trust every IP
# as a Cloudflare proxy: that lets a direct visitor forge their IP address.

server {
    listen 80;
    listen [::]:80;
    server_name skylineengineering.es www.skylineengineering.es;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skylineengineering.es www.skylineengineering.es;

    ssl_certificate     /etc/letsencrypt/live/skylineengineering.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skylineengineering.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Enable only after /etc/nginx/conf.d/cloudflare-real-ip.conf is installed:
    # include /etc/nginx/conf.d/cloudflare-real-ip.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Security headers (Next.js also sets some via next.config.mjs headers())
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 5m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Basic protection for the contact API route; pair with Cloudflare rate
    # limiting rules for stronger protection at the edge.
    location /api/contact {
        limit_req zone=contact_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Install deploy/nginx-rate-limit.conf as /etc/nginx/conf.d/skyline-rate-limit.conf
# before enabling this site.
